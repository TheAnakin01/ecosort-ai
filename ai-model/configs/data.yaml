# Dataset config for Ultralytics YOLO.
# "path" is the dataset folder; train/val/test are folders inside it.
# Each image needs a matching .txt label file (YOLO format) in labels/.
#
# datasets/ecosort/
#   images/train  images/val  images/test
#   labels/train  labels/val  labels/test

path: ../datasets/ecosort
train: images/train
val: images/val
test: images/test

names:
  0: paper
  1: plastic
  2: metal
  3: organic
