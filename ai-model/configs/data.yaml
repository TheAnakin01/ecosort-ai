# Dataset config for Ultralytics YOLO.
# "path" is the dataset folder, relative to this file; train/val/test are
# folders inside it. train.py and evaluate.py turn it into a full path before
# handing it to Ultralytics.
# Each image needs a matching .txt label file (YOLO format) in labels/.
#
# datasets/ecosort/
#   images/train  images/val  images/test
#   labels/train  labels/val  labels/test

path: ../datasets/ecosort
train: images/train
val: images/val
test: images/test

names:
  0: paper
  1: plastic
  2: metal
  3: organic
