# Manual class mappings for scripts/prepare_dataset.py.
#
# The script maps source classes to our four by keyword. Use this file when it
# gets one wrong or cannot decide. Run the script with --dry-run to see the
# mapping first.
#
# Format:  source class name (lower case): paper | plastic | metal | organic | drop
#
# Every line here is a decision about what the model is taught. Record the
# reasoning in docs/dataset-card.md.

# TrashNet has separate cardboard and paper classes; both are paper for us.
cardboard: paper

# ----- Decided after reviewing the first real merge (2026-11-15) -----

# Containers that held food. The keyword "food" had mapped these to organic,
# which taught the model that foam and plastic containers are food waste.
# They are a mix of plastic, foam and foil, so they are left out.
disposable food container: drop
foam food container: drop

# ----- Suggested, waiting for a team decision -----
# These were dropped by the first merge. Each looks like one clear material.
# Uncomment a line to include that class in the next training run.
# food can: metal              # 34 boxes
# pop tab: metal               # 99 boxes
# pizza box: paper             # 3 boxes; often greasy
# toilet tube: paper           # 5 boxes
# single-use carrier bag: plastic   # 61 boxes
