# Builds an installable Android APK on GitHub's machines, without an Expo
# account: expo prebuild generates the native project, Gradle builds it.
#
# The APK is signed with the debug key, which is fine for installing on
# phones by hand (demo, testing) but not for the Play Store; use EAS for that.
#
# Run it from the Actions tab ("Build Android APK", "Run workflow"), then
# download it from the "Android APK (latest build)" release (direct .apk link,
# easiest on a phone) or from the run's Artifacts section (a zip).

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [feature/finish-mvp]
    paths: ["mobile/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write  # to publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Repo variable API_URL (the Render address); the fallback is the
      # address in render.yaml. Baked into the app at build time.
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://ecosort-ai-srujan26.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK (64-bit ARM, which covers current Android phones)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Name the file
        run: |
          mkdir -p ../apk
          cp android/app/build/outputs/apk/release/app-release.apk "../apk/ecosort-ai-${GITHUB_SHA::7}.apk"
          ls -la ../apk
      - uses: actions/upload-artifact@v4
        with:
          name: ecosort-apk
          path: apk/*.apk
          retention-days: 30
      - name: Publish as the "apk-latest" release (direct download link)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest apk/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android APK (latest build)" \
            --notes "Debug-signed test build from ${GITHUB_SHA::7}. Backend: $EXPO_PUBLIC_API_URL. Install by opening the .apk on the phone and allowing installs from this source."
