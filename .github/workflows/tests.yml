# Runs the automated checks on every push and pull request.
# None of these jobs needs a trained model, PyTorch or a GPU.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Backend and dataset scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements-*.txt
            ai-model/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt -r ai-model/requirements-dev.txt ruff~=0.16.9
      - name: Lint
        run: ruff check backend ai-model
      - name: Backend tests
        working-directory: backend
        run: pytest
      - name: Dataset script tests
        working-directory: ai-model
        run: pytest

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
